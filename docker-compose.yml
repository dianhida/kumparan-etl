version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kumparan-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kumparan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kumparan}
      POSTGRES_DB: ${POSTGRES_DB:-kumparan}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kumparan} -d ${POSTGRES_DB:-kumparan}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: kumparan-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@kumparan.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: kumparan-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Create airflow schema in PostgreSQL
        psql -h postgres -U kumparan -d kumparan -c "CREATE SCHEMA IF NOT EXISTS airflow; GRANT ALL ON SCHEMA airflow TO kumparan;"
        # Initialize Airflow directories
        mkdir -p /opt/airflow/dags /opt/airflow/logs /opt/airflow/plugins /opt/airflow/config /opt/airflow/data
        chown -R 50000:0 /opt/airflow
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    user: "0:0"
    volumes:
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - airflow_config:/opt/airflow/config
      - ./dags:/opt/airflow/dags
      - warehouse_data:/opt/airflow/data
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: kumparan-airflow-webserver
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@kumparan.local \
          --password admin
        airflow webserver
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-kumparan}:${POSTGRES_PASSWORD:-kumparan}@postgres:5432/${POSTGRES_DB:-kumparan}?options=-csearch_path%3Dairflow
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-your-secret-key-change-in-production}
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'True'
      POSTGRES_HOST: postgres
      DUCKDB_PATH: /opt/airflow/data/warehouse.duckdb
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    volumes:
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - airflow_config:/opt/airflow/config
      - ./dags:/opt/airflow/dags
      - warehouse_data:/opt/airflow/data
    depends_on:
      - postgres
      - airflow-init
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: kumparan-airflow-scheduler
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-kumparan}:${POSTGRES_PASSWORD:-kumparan}@postgres:5432/${POSTGRES_DB:-kumparan}?options=-csearch_path%3Dairflow
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-your-secret-key-change-in-production}
      POSTGRES_HOST: postgres
      DUCKDB_PATH: /opt/airflow/data/warehouse.duckdb
    volumes:
      - airflow_logs:/opt/airflow/logs
      - airflow_plugins:/opt/airflow/plugins
      - airflow_config:/opt/airflow/config
      - ./dags:/opt/airflow/dags
      - warehouse_data:/opt/airflow/data
    depends_on:
      - postgres
      - airflow-init
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
  airflow_logs:
  airflow_plugins:
  airflow_config:
  warehouse_data: